# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "mightex-slc"
version = "0.0.0"
description = "Python library for Mightex Sirius SLC-series multi-channel LED controllers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pyserial",
]


[project.optional-dependencies]
dev = [
    "ruff",
    "pyyaml",
]


[tool.hatch.build.targets.wheel]
packages = ["src/mightex_slc"]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes: undefined names, unused imports, etc.
    "I",   # import sorting
    "B",   # flake8-bugbear: likely bugs / unsafe patterns
    "UP",  # pyupgrade: modern Python syntax
    "RUF", # Ruff-specific rules
]

ignore = [
    "E501", # line length; formatter handles most wrapping
]


[tool.ruff.lint.per-file-ignores]
"src/mightex_slc/**/__init__.py" = [
    "F401", # allow intentional public re-exports
]


[tool.ruff.lint.isort]
known-first-party = ["mightex_slc"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
