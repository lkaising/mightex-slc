[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mightex-slc"
version = "0.0.0"
description = "Python library for Mightex Sirius SLC-series multi-channel LED controllers."
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pyserial",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mightex_slc"]
